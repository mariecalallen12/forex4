name: Backend CI/CD

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint Backend Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy bandit safety
          pip install -r requirements.txt

      - name: Run Black (Code Formatter Check)
        run: |
          cd backend
          black --check --diff .
        continue-on-error: true

      - name: Run isort (Import Sorter Check)
        run: |
          cd backend
          isort --check-only --diff .
        continue-on-error: true

      - name: Run Flake8 (Linter)
        run: |
          cd backend
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install bandit safety
          pip install -r requirements.txt

      - name: Run Bandit (Security Scanner)
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f screen
        continue-on-error: true

      - name: Check Dependencies (Safety)
        run: |
          cd backend
          safety check --json || true
          safety check
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-html
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          cd backend
          cat > .env.test <<EOF
          SECRET_KEY=test-secret-key-for-ci-cd-pipeline
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          POSTGRES_SERVER=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_pass
          POSTGRES_DB=test_db
          REDIS_HOST=localhost
          REDIS_PORT=6379
          ENVIRONMENT=test
          DEBUG=true
          EOF

      - name: Run Simple Tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline
        run: |
          cd backend
          python simple_test.py
        continue-on-error: true

      - name: Run Pytest with Coverage
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --html=test-report.html --self-contained-html
        continue-on-error: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: coverage-report
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 30

      - name: Upload Test Report
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: test-report
          path: backend/test-report.html
          retention-days: 30

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        continue-on-error: true
        with:
          coverageFile: backend/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: forex4-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: backend-docker-image
          path: /tmp/backend-image.tar
          retention-days: 7

  health-check:
    name: Backend Health Check
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend in background
        env:
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENVIRONMENT: test
          DEBUG: true
        run: |
          cd backend
          # start uvicorn in background and redirect logs to file
          uvicorn main:app --host 0.0.0.0 --port 8000 --log-level debug > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Started backend with PID $(cat backend.pid)"

      - name: Wait for backend to become healthy
        run: |
          cd backend
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done
          echo "Backend did not become healthy within timeout"
          echo "=== Backend logs ==="
          cat backend.log || true
          echo "=== Last 200 lines of backend.log ==="
          tail -n 200 backend.log || true
          exit 1

      - name: Health Check
        run: |
          curl -fsS http://localhost:8000/health || exit 1
          curl -fsS http://localhost:8000/docs || exit 1

      - name: Stop backend
        if: always()
        run: |
          cd backend
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, build, health-check]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## Backend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Health Check: ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
