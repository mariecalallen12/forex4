name: Frontend CI/CD

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'client-app/**'
      - 'Admin-app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'client-app/**'
      - 'Admin-app/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  lint-client:
    name: Lint Client App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client-app/package-lock.json

      - name: Install dependencies
        run: |
          cd client-app
          npm ci

      - name: Check for linting scripts
        id: check-lint
        run: |
          cd client-app
          if grep -q '"lint"' package.json; then
            echo "has_lint=true" >> $GITHUB_OUTPUT
          else
            echo "has_lint=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ESLint
        if: steps.check-lint.outputs.has_lint == 'true'
        run: |
          cd client-app
          npm run lint
        continue-on-error: true

  build-client:
    name: Build Client App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client-app/package-lock.json

      - name: Install dependencies
        run: |
          cd client-app
          npm ci

      - name: Build Application
        run: |
          cd client-app
          npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: client-app-dist
          path: client-app/dist/
          retention-days: 7

      - name: Check Build Size
        run: |
          cd client-app/dist
          echo "## Client App Build Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh . >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top 10 Largest Files" >> $GITHUB_STEP_SUMMARY
          find . -type f -exec du -h {} + | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY

  docker-client:
    name: Build Client Docker Image
    runs-on: ubuntu-latest
    needs: [build-client]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client-app
          file: ./client-app/Dockerfile
          push: false
          tags: forex4-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000

  lint-admin:
    name: Lint Admin App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Admin-app/package-lock.json

      - name: Install dependencies
        run: |
          cd Admin-app
          npm ci

      - name: Check for linting scripts
        id: check-lint
        run: |
          cd Admin-app
          if grep -q '"lint"' package.json; then
            echo "has_lint=true" >> $GITHUB_OUTPUT
          else
            echo "has_lint=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ESLint
        if: steps.check-lint.outputs.has_lint == 'true'
        run: |
          cd Admin-app
          npm run lint
        continue-on-error: true

  build-admin:
    name: Build Admin App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Admin-app/package-lock.json

      - name: Install dependencies
        run: |
          cd Admin-app
          npm ci

      - name: Build Application
        run: |
          cd Admin-app
          npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: admin-app-dist
          path: Admin-app/dist/
          retention-days: 7

      - name: Check Build Size
        run: |
          cd Admin-app/dist
          echo "## Admin App Build Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh . >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top 10 Largest Files" >> $GITHUB_STEP_SUMMARY
          find . -type f -exec du -h {} + | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY

  docker-admin:
    name: Build Admin Docker Image
    runs-on: ubuntu-latest
    needs: [build-admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Admin Image
        uses: docker/build-push-action@v6
        with:
          context: ./Admin-app
          file: ./Admin-app/Dockerfile
          push: false
          tags: forex4-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000

  test-integration:
    name: Frontend Integration Test
    runs-on: ubuntu-latest
    needs: [docker-client, docker-admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test Client API Connection Script
        run: |
          cd client-app
          if [ -f "scripts/test-client-api.mjs" ]; then
            npm ci
            npm run test:api || true
          else
            echo "No API test script found, skipping"
          fi
        continue-on-error: true

  summary:
    name: Frontend CI Summary
    runs-on: ubuntu-latest
    needs: [lint-client, build-client, docker-client, lint-admin, build-admin, docker-admin, test-integration]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Client App" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting: ${{ needs.lint-client.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ needs.build-client.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker: ${{ needs.docker-client.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Admin App" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting: ${{ needs.lint-admin.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ needs.build-admin.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker: ${{ needs.docker-admin.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Integration" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
